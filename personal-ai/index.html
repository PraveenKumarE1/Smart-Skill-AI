<!doctype html><html lang='en'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Personal AI</title><link rel='stylesheet' href='/static/style.css'></head>
<body><div class='app'><aside><h1>Personal AI</h1><p class='muted'>Private • Local • Yours</p><section><h3>Memory</h3><input id='memoryInput' placeholder='e.g. I prefer Java'><button onclick='saveMemory()'>Remember</button><div id='memoryList'></div></section><section><h3>Quick note</h3><textarea id='noteInput' placeholder='Write a note...'></textarea><button onclick='saveNote()'>Save note</button></section></aside>
<main><header><div><strong>My Personal AI</strong><span id='status'>Local assistant</span></div><button class='ghost' onclick='clearChat()'>Clear</button></header><div id='chat'></div><form id='form'><input id='message' autocomplete='off' placeholder='Talk to your Personal AI…' required><button>Send</button></form></main></div>
<script>
const chat=document.getElementById('chat'),status=document.getElementById('status');
function add(role,text){const el=document.createElement('div');el.className='bubble '+role;el.textContent=text;chat.appendChild(el);chat.scrollTop=chat.scrollHeight;}
async function send(e){e.preventDefault();const input=document.getElementById('message'),msg=input.value.trim();if(!msg)return;add('user',msg);input.value='';add('assistant','Thinking…');const thinking=chat.lastChild;try{const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg})});const d=await r.json();thinking.textContent=d.reply||d.error;status.textContent=d.local_model?'● Local model online':'● Offline fallback'}catch(err){thinking.textContent='Unable to reach the local server.'}}
async function saveMemory(){const input=document.getElementById('memoryInput'),text=input.value.trim();if(!text)return;await fetch('/api/memory',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});input.value='';loadMemory()}
async function loadMemory(){const r=await fetch('/api/memory'),data=await r.json();document.getElementById('memoryList').innerHTML=data.slice(-8).map(m=>'<div class="memory">'+escapeHtml(m.text)+'</div>').join('')}
async function saveNote(){const input=document.getElementById('noteInput'),text=input.value.trim();if(!text)return;await fetch('/api/notes',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({text})});input.value=''}
function escapeHtml(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))} function clearChat(){chat.innerHTML='';add('assistant','Chat cleared. How can I help?')}
document.getElementById('form').addEventListener('submit',send);add('assistant','Hello! I’m your private Personal AI. I can chat, remember useful information, and save notes.');loadMemory();
</script></body></html>
